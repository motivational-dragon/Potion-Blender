plugins {
    id 'fabric-loom' version '1.6-SNAPSHOT'
    id 'multiloader-loader'
}

archivesBaseName = "${mod_name}-${minecraft_version}-FABRIC"
if (System.getenv().RELEASE_MODE == null) {
    archivesBaseName += '-SNAPSHOT'
}
dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    //Jei
    compileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    modCompileOnlyApi("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
    // at runtime, use the full JEI jar for Fabric
    modRuntimeOnly("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")

}

loom {
    mixin.defaultRefmapName = "potionblender.refmap.json"
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run")
        }
        gameTest {
            server()
            vmArg "-Dfabric-api.gametest=1"
        }
    }
}

tasks.withType(JavaExec).configureEach {
    if (System.getenv().RELEASE_MODE == null) {
        enableAssertions = true
    }
}
processResources {
    from project(":common").sourceSets.main.resources

    inputs.properties(
            "mod_id" : mod_id,
            "version": project.version,
            minecraft_version: minecraft_version,
            "mod_name": mod_name,
            description: description,
            "fabric_loader_version": fabric_loader_version,
            credits: credits
    )
    filesMatching("fabric.mod.json") {
        expand (
                "mod_id": mod_id,
                "version": project.version,
                minecraft_version: minecraft_version,
                "mod_name" : mod_name,
                description: description,
                credits: credits,
                "fabric_loader_version": fabric_loader_version,
        )
    }
    filesMatching('pack.mcmeta') {
        expand("mod_name": mod_name)
    }
}

jar{
    manifest {
        attributes([
                "Specification-Title": mod_name,
                "Specification-Vendor": credits,
                "Specification-Version": "1",
                "Implementation-Title": mod_name,
                "Implementation-Version": version,
                "Implementation-Vendor" : credits,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}


