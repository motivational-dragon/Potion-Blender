
plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.133'
}

apply plugin: 'org.spongepowered.mixin'

tasks.withType(JavaExec) {
    enableAssertions = true
}


archivesBaseName = "${mod_name}-${minecraft_version}-FORGE"
if (System.getenv().RELEASE_MODE == null) {
    archivesBaseName += '-SNAPSHOT'
}


mixin {
    add sourceSets.main, "potionblender.refmap.json"
    config 'potionblender.mixins.json'

    if (System.getenv().RELEASE_MODE == null) {
        archivesBaseName += '-SNAPSHOT'
    }
}

minecraft {
    mappings channel: 'official', version: minecraft_version

    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    runs {
        client {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modClientRun {
                    source sourceSets.main
                    source project(":Common").sourceSets.main
                }
            }
        }

        server {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            workingDirectory project.file('run')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                modServerRun {
                    source sourceSets.main
                    source project(":Common").sourceSets.main
                }
            }
        }

        data {
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    gameTest {
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        workingDirectory project.file('run')
        ideaModule "${rootProject.name}.${project.name}.main"
        taskName 'gameTest'
        property 'mixin.env.remapRefMap', 'true'
        property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
        mods {
            modServerRun {
                source sourceSets.main
                source project(":Common").sourceSets.main
            }
        }
    }

}


sourceSets.main.resources { srcDir 'src/generated/resources' }

dependencies {

    implementation "net.neoforged:neoforge:${neo_version}"

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly project(":Common")
    //compileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"))
    //testCompileOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}") )
    // at runtime, use the full JEI jar for Forge
    //runtimeOnly(fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}"))
}

tasks.withType(JavaCompile) {
    source(project(":Common").sourceSets.main.allSource)
}

processResources {

    from project(":Common").sourceSets.main.resources

    inputs.properties(
            "mod_id": mod_id,
            "version": project.version,
            "mod_name": mod_name,
            "mod_description": mod_description,
            "forge_version": forge_version,
            minimum_neoforge_version: minimum_neoforge_version,
            "mod_author": mod_author,
            "minecraft_version": minecraft_version
    )


    filesMatching("META-INF/mods.toml") {
        expand(
                "mod_id": mod_id,
                "version": project.version,
                "mod_name": mod_name,
                "mod_description": mod_description,
                "mod_author": mod_author,
                "forge_version": forge_version,
                minimum_neoforge_version: minimum_neoforge_version,
                "minecraft_version": minecraft_version
        )
    }

    filesMatching('pack.mcmeta') {
        expand("mod_name": mod_name)
    }
}


jar {
    manifest {
        attributes([
                "Specification-Title"     : mod_name,
                "Specification-Vendor"    : mod_author,
                "Specification-Version"   : "1", // We are version 1 of ourselves
                "Implementation-Title"    : mod_name,
                "Implementation-Version"  : version,
                "Implementation-Vendor"   : mod_author,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
    finalizedBy('reobfJar')
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}


